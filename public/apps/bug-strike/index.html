<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bug Strike</title>
  <link rel="stylesheet" href="styles.css?v=bugstrike-20260629-mobile-lite1">
</head>
<body>
  <main class="shell">
    <canvas id="game" width="1200" height="900" aria-label="Bug Strike playfield"></canvas>

    <section id="menu" class="panel active">
      <h1 class="sr-only">Bug Strike</h1>
      <div class="menu-actions" aria-label="Main menu">
        <button data-action="start">Start Game</button>
        <button data-action="settings">Settings</button>
        <button data-action="leaderboard">Leaderboard</button>
      </div>
    </section>

    <section id="pause" class="panel">
      <p class="panel-kicker">Runtime Suspended</p>
      <h2>Paused</h2>
      <div class="panel-actions">
        <button data-action="resume">Resume</button>
        <button data-action="settings">Settings</button>
        <button data-action="menu">Main Menu</button>
      </div>
    </section>

    <section id="settings" class="panel">
      <p class="panel-kicker">Audio Bus</p>
      <h2>Settings</h2>
      <label>Music <input id="musicVolume" type="range" min="0" max="100" value="20"></label>
      <label>SFX <input id="sfxVolume" type="range" min="0" max="100" value="10"></label>
      <button data-action="back">Back</button>
    </section>

    <section id="leaderboard" class="panel wide">
      <h2>Leaderboard</h2>
      <ol id="scores"></ol>
      <h3>Achievements</h3>
      <ul id="achievements"></ul>
      <button data-action="back">Back</button>
    </section>

    <section id="initials" class="panel">
      <p class="panel-kicker">Run Signature</p>
      <h2>New High Score</h2>
      <p id="finalScore"></p>
      <input id="initialsInput" maxlength="3" autocomplete="off" spellcheck="false" aria-label="Initials">
      <div class="panel-actions">
        <button data-action="save-score">Save</button>
        <button data-action="skip-score">Skip</button>
      </div>
    </section>

    <section id="gameOver" class="panel">
      <p class="panel-kicker">Connection Lost</p>
      <h2>Game Over</h2>
      <p id="gameOverScore"></p>
      <div class="panel-actions">
        <button data-action="start">Restart</button>
        <button data-action="leaderboard">Leaderboard</button>
        <button data-action="menu">Main Menu</button>
      </div>
    </section>
  </main>
  <div class="mobile-controls" aria-label="Touch combat controls">
    <button class="touch-button fire" data-touch-action="fire" aria-label="Fire">FIRE</button>
    <button class="touch-button bomb" data-touch-action="bomb" aria-label="Bomb">BOMB</button>
    <button class="touch-button pause" data-touch-action="pause" aria-label="Pause">II</button>
  </div>

  <script src="src/assets.js?v=bugstrike-20260629-mobile-lite1"></script>
  <script src="src/core.js?v=bugstrike-20260629-mobile-lite1"></script>
  <script src="src/game.js?v=bugstrike-20260629-mobile-lite1"></script>
</body>
</html>
